<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Категорії — адмін-панель | OmniTech</title>
  <meta name="description" content="Керування категоріями товарів OmniTech.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
  <!--boot-->
  <script type="module" src="/src/pages/admin/categories.js"></script>
</head>
<body class="flex min-h-dvh flex-col bg-paper font-sans text-ink antialiased dark:bg-ink dark:text-paper">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-coal focus:px-5 focus:py-3 focus:text-paper">Перейти до вмісту</a>
  <!-- Шапку й підвал малює JavaScript (src/layout). Висота шапки зарезервована, щоб сторінка не «стрибала» -->
  <div id="site-header" class="min-h-[65px]"></div>
  <main id="main" tabindex="-1" class="mx-auto w-full max-w-7xl flex-grow px-4 pb-20 pt-8 outline-none sm:px-6 md:pt-12 lg:px-8">
    <!-- Каркас адмін-панелі: бічне меню (малює src/layout/admin.js) і вміст розділу.
         Якщо зайшов не адміністратор, увесь блок замінюється повідомленням «Доступ заборонено» -->
    <div id="admin-root" class="grid grid-cols-1 gap-8 lg:grid-cols-[14rem_minmax(0,1fr)] lg:gap-10">
      <nav id="admin-nav" aria-label="Розділи адмін-панелі"></nav>
      <section class="min-w-0">
        <h1 class="page-title">Категорії</h1>
        <p class="muted mt-3 text-lg">Категорію, у якій є товари, видалити не можна: спершу перенесіть або видаліть товари.</p>

        <form id="add-form" novalidate class="card mt-8 flex flex-col gap-3 p-5 sm:flex-row sm:items-start">
          <div class="flex-1">
            <label for="new-name" class="sr-only">Назва нової категорії</label>
            <input id="new-name" name="name" type="text" maxlength="50" placeholder="Назва нової категорії" class="input" aria-describedby="new-name-error">
            <p id="new-name-error" class="field-error" hidden></p>
            <div data-form-error class="alert alert-error mt-3" role="alert" hidden></div>
          </div>
          <button type="submit" class="btn btn-primary"><i class="ph ph-plus" aria-hidden="true"></i> Додати</button>
        </form>

        <div id="table" class="table-wrap mt-6"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <noscript>
    <p class="mx-auto mb-8 max-w-7xl px-4 text-center">Для роботи магазину потрібно ввімкнути JavaScript у браузері.</p>
  </noscript>
</body>
</html>
