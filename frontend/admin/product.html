<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — адмін-панель | OmniTech</title>
  <meta name="description" content="Додавання й редагування товару OmniTech.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
  <!--boot-->
  <script type="module" src="/src/pages/admin/product-form.js"></script>
</head>
<body class="flex min-h-dvh flex-col bg-paper font-sans text-ink antialiased dark:bg-ink dark:text-paper">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-coal focus:px-5 focus:py-3 focus:text-paper">Перейти до вмісту</a>
  <!-- Шапку й підвал малює JavaScript (src/layout). Висота шапки зарезервована, щоб сторінка не «стрибала» -->
  <div id="site-header" class="min-h-[65px]"></div>
  <main id="main" tabindex="-1" class="mx-auto w-full max-w-7xl flex-grow px-4 pb-20 pt-8 outline-none sm:px-6 md:pt-12 lg:px-8">
    <!-- Каркас адмін-панелі: бічне меню (малює src/layout/admin.js) і вміст розділу.
         Якщо зайшов не адміністратор, увесь блок замінюється повідомленням «Доступ заборонено» -->
    <div id="admin-root" class="grid grid-cols-1 gap-8 lg:grid-cols-[14rem_minmax(0,1fr)] lg:gap-10">
      <nav id="admin-nav" aria-label="Розділи адмін-панелі"></nav>
      <section class="min-w-0">
        <a href="/admin/products.html" class="link inline-flex items-center gap-1 text-sm"><i class="ph ph-arrow-left" aria-hidden="true"></i> Усі товари</a>
        <h1 id="form-title" class="page-title mt-4">Новий товар</h1>

        <div id="form-root" class="mt-8 grid gap-6 xl:grid-cols-[minmax(0,1fr)_20rem]">
          <form id="product-form" novalidate class="card space-y-5 p-6 sm:p-8">
            <div>
              <label for="name" class="label">Назва</label>
              <input id="name" name="name" type="text" maxlength="200" class="input" aria-describedby="name-error">
              <p id="name-error" class="field-error" hidden></p>
            </div>
            <div class="grid gap-5 sm:grid-cols-2">
              <div>
                <label for="category_id" class="label">Категорія</label>
                <select id="category_id" name="category_id" class="input" aria-describedby="category_id-error">
                  <option value="">Оберіть категорію</option>
                </select>
                <p id="category_id-error" class="field-error" hidden></p>
              </div>
              <div>
                <label for="price" class="label">Ціна, грн</label>
                <input id="price" name="price" type="number" min="1" max="10000000" step="1" inputmode="numeric" class="input" aria-describedby="price-error">
                <p id="price-error" class="field-error" hidden></p>
              </div>
            </div>
            <div>
              <label for="description" class="label">Опис</label>
              <textarea id="description" name="description" rows="5" maxlength="1000" class="input" aria-describedby="description-hint description-error"></textarea>
              <p id="description-hint" class="hint">До 1000 символів. Переноси рядків збережуться.</p>
              <p id="description-error" class="field-error" hidden></p>
            </div>
            <div>
              <label for="image_url" class="label">Адреса картинки (необов'язково)</label>
              <input id="image_url" name="image_url" type="url" maxlength="500" placeholder="https://…" class="input" aria-describedby="image_url-hint image_url-error">
              <p id="image_url-hint" class="hint">Посилання на картинку в інтернеті. Або збережіть товар і завантажте файл з комп'ютера.</p>
              <p id="image_url-error" class="field-error" hidden></p>
            </div>
            <label class="flex min-h-11 cursor-pointer items-center gap-3">
              <input id="is_featured" name="is_featured" type="checkbox" class="size-5 accent-gold">
              <span>Показувати на головній сторінці</span>
            </label>
            <div data-form-error class="alert alert-error" role="alert" hidden></div>
            <div class="flex flex-wrap gap-3">
              <button type="submit" class="btn btn-primary">Зберегти</button>
              <button id="delete-product" type="button" class="btn btn-danger" hidden>Видалити товар</button>
            </div>
          </form>

          <!-- Фото: завантажити файл можна лише в товар, який уже збережено (потрібен його номер) -->
          <aside id="image-box" class="card h-fit space-y-4 p-6" aria-labelledby="image-title" hidden>
            <h2 id="image-title" class="text-lg font-semibold">Фото товару</h2>
            <div id="image-preview" class="overflow-hidden rounded-xl border border-line dark:border-line-dark"></div>
            <form id="image-form" novalidate class="space-y-3">
              <div>
                <label for="file" class="label">Файл JPEG, PNG або WebP, до 5 МБ</label>
                <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp" class="block w-full text-sm file:mr-3 file:cursor-pointer file:rounded-full file:border-0 file:bg-coal file:px-4 file:py-2 file:font-semibold file:text-paper dark:file:bg-paper dark:file:text-ink" aria-describedby="file-error">
                <p id="file-error" class="field-error" hidden></p>
              </div>
              <div data-form-error class="alert alert-error" role="alert" hidden></div>
              <div class="flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary">Завантажити</button>
                <button id="delete-image" type="button" class="btn btn-danger" hidden>Прибрати фото</button>
              </div>
            </form>
          </aside>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <noscript>
    <p class="mx-auto mb-8 max-w-7xl px-4 text-center">Для роботи магазину потрібно ввімкнути JavaScript у браузері.</p>
  </noscript>
</body>
</html>
