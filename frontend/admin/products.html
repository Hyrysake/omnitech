<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товари — адмін-панель | OmniTech</title>
  <meta name="description" content="Керування товарами магазину OmniTech.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
  <!--boot-->
  <script type="module" src="/src/pages/admin/products.js"></script>
</head>
<body class="flex min-h-dvh flex-col bg-paper font-sans text-ink antialiased dark:bg-ink dark:text-paper">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-coal focus:px-5 focus:py-3 focus:text-paper">Перейти до вмісту</a>
  <!-- Шапку й підвал малює JavaScript (src/layout). Висота шапки зарезервована, щоб сторінка не «стрибала» -->
  <div id="site-header" class="min-h-[65px]"></div>
  <main id="main" tabindex="-1" class="mx-auto w-full max-w-7xl flex-grow px-4 pb-20 pt-8 outline-none sm:px-6 md:pt-12 lg:px-8">
    <!-- Каркас адмін-панелі: бічне меню (малює src/layout/admin.js) і вміст розділу.
         Якщо зайшов не адміністратор, увесь блок замінюється повідомленням «Доступ заборонено» -->
    <div id="admin-root" class="grid grid-cols-1 gap-8 lg:grid-cols-[14rem_minmax(0,1fr)] lg:gap-10">
      <nav id="admin-nav" aria-label="Розділи адмін-панелі"></nav>
      <section class="min-w-0">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <h1 class="page-title">Товари</h1>
          <a href="/admin/product.html" class="btn btn-primary"><i class="ph ph-plus" aria-hidden="true"></i> Додати товар</a>
        </div>

        <form id="filters" novalidate class="card mt-8 grid grid-cols-1 gap-4 p-5 sm:grid-cols-3">
          <div>
            <label for="q" class="label">Пошук</label>
            <input id="q" name="q" type="search" maxlength="100" placeholder="Назва або опис" class="input">
          </div>
          <div>
            <label for="category" class="label">Категорія</label>
            <select id="category" name="category" class="input"><option value="">Усі категорії</option></select>
          </div>
          <div>
            <label for="featured" class="label">На головній</label>
            <select id="featured" name="featured" class="input">
              <option value="">Усі товари</option>
              <option value="true">Лише на головній</option>
              <option value="false">Не на головній</option>
            </select>
          </div>
          <div class="flex flex-wrap items-center gap-3 sm:col-span-3">
            <button type="submit" class="btn btn-primary"><i class="ph ph-magnifying-glass" aria-hidden="true"></i> Знайти</button>
            <p class="muted text-sm" aria-live="polite">Знайдено: <span id="total" class="font-semibold tabular-nums">…</span></p>
          </div>
        </form>

        <div id="table" class="table-wrap mt-6"></div>
        <nav id="pagination" class="mt-8" aria-label="Сторінки списку товарів"></nav>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <noscript>
    <p class="mx-auto mb-8 max-w-7xl px-4 text-center">Для роботи магазину потрібно ввімкнути JavaScript у браузері.</p>
  </noscript>
</body>
</html>
