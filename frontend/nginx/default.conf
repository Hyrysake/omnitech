# Nginx для OmniTech: віддає зібраний сайт і пересилає /api та /media на бекенд (reverse proxy).
# Сайт і API на одній адресі, тому браузер не перевіряє CORS.

# Вбудований DNS Docker. Адресу бекенду Nginx шукає під час запиту (а не лише при старті), тому після
# перестворення контейнера backend з новою IP-адресою проксі продовжує працювати
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Картинка до 5 МБ + службові частини запиту (ліміт бекенду: MAX_UPLOAD_MB)
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Невідома адреса -> наша сторінка 404.html зі статусом 404 (сайт багатосторінковий, повернення index.html не потрібне)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Для перевірки стану контейнера
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, картинки товарів і документація FastAPI (/docs) -> бекенд
    location ~ ^/(api/|media/|docs$|redoc$|openapi\.json$) {
        set $backend http://backend:8000;       # змінна змушує Nginx користуватися resolver
        proxy_pass $backend;                    # без змінної частини шляху адреса передається як є
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Файли з хешем у назві (assets/app-3f2a1b.js) ніколи не змінюються, тож браузер може тримати їх рік
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
