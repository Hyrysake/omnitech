<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар | OmniTech</title>
  <meta name="description" content="Опис товару, ціна та відгуки покупців OmniTech.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
  <!--boot-->
  <script type="module" src="/src/pages/product.js"></script>
</head>
<body class="flex min-h-dvh flex-col bg-paper font-sans text-ink antialiased dark:bg-ink dark:text-paper">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-coal focus:px-5 focus:py-3 focus:text-paper">Перейти до вмісту</a>
  <!-- Шапку й підвал малює JavaScript (src/layout). Висота шапки зарезервована, щоб сторінка не «стрибала» -->
  <div id="site-header" class="min-h-[65px]"></div>
  <main id="main" tabindex="-1" class="frame flex-grow pb-24 pt-6 outline-none md:pt-8">
    <!-- Вміст малює src/pages/product.js: номер товару береться з адреси (product.html?id=5) -->
    <!-- min-h резервує місце під вміст, поки він завантажується: підвал не «стрибає» вниз, коли з'являється товар -->
    <!-- Каркас сторінки товару вже в HTML: місце фото, назви, ціни й опису видно одразу, ще до відповіді сервера;
         product.js замінює його справжнім вмістом (render() міняє всі дочірні елементи) -->
    <article id="product" class="min-h-[40rem]" aria-live="polite" aria-busy="true">
      <p class="sr-only">Завантаження товару…</p>
      <div class="pd-grid" aria-hidden="true">
        <div class="skeleton aspect-square w-full"></div>
        <div class="flex flex-col gap-4 pt-6">
          <div class="skeleton h-3 w-1/4"></div>
          <div class="skeleton h-10 w-4/5"></div>
          <div class="skeleton h-5 w-1/3"></div>
          <div class="skeleton h-9 w-2/5"></div>
          <div class="skeleton mt-4 h-4 w-full"></div>
          <div class="skeleton h-4 w-11/12"></div>
          <div class="skeleton h-4 w-3/4"></div>
          <div class="skeleton mt-4 h-12 w-56 rounded-full"></div>
        </div>
      </div>
    </article>

    <section id="reviews-section" class="mt-24 border-t border-[var(--hair)] pt-12 md:mt-32" aria-labelledby="reviews-title" hidden>
      <div class="flex flex-wrap items-end justify-between gap-4">
        <h2 id="reviews-title" class="lockup block-lockup" data-reveal><span class="serif">Що кажуть</span><span class="sans">Відгуки покупців</span></h2>
        <p id="reviews-summary" class="muted flex items-center gap-2"></p>
      </div>
      <!-- Форма відгуку: для гостя — запрошення увійти, для покупця — «написати» або «змінити свій» -->
      <div id="review-form-box" class="mt-8"></div>
      <div id="reviews-list" class="mt-8 grid gap-4"></div>
      <div class="mt-6 flex justify-center">
        <button id="reviews-more" type="button" class="btn btn-secondary" hidden>Показати ще відгуки</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <noscript>
    <p class="mx-auto mb-8 max-w-7xl px-4 text-center">Для роботи магазину потрібно ввімкнути JavaScript у браузері.</p>
  </noscript>
</body>
</html>
