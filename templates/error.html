{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
{# Спільна сторінка для помилок 403 і 404: код, заголовок і пояснення передає обробник у app.py #}
<section class="mx-auto flex max-w-xl flex-col items-center py-12 text-center sm:py-20">
    <p class="reveal font-display text-8xl font-semibold text-gold dark:text-gold-bright sm:text-9xl">{{ code }}</p>
    <h1 class="reveal mt-4 font-display text-4xl font-semibold tracking-tight" style="--i: 1">{{ title }}</h1>
    <p class="reveal mt-4 text-lg leading-relaxed text-muted dark:text-muted-dark" style="--i: 2">{{ text }}</p>
    <div class="reveal mt-10 flex flex-wrap justify-center gap-3" style="--i: 3">
        <a href="{{ url_for('home') }}" class="btn btn-primary">На головну</a>
        <a href="{{ url_for('shop.catalog') }}" class="btn btn-secondary">До каталогу</a>
    </div>
</section>
{% endblock %}
